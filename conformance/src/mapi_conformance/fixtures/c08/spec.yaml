apiVersion: mapi/v1
kind: ModelSpec
metadata: {name: mauna-loa-co2, project: climate, labels: {corpus: c08}}
data:
  dataset: dataset://climate/mauna_loa_monthly@latest
  bind:
    dims: {t: date}
    vars: {y: co2}
  split: {kind: time_holdout, dim: t, last: 12}
pipeline:
  - {id: clean, use: core.replace_sentinel@^1, with: {vars: [y], below: 0}}
  - {id: scale, use: core.standardize@^1, with: {vars: [y], over: [t]}}
model:
  use: ts.hsgp_trend@^1
  settings: {max_extension: 24, m: 30, season_order: 2, lengthscale_mu: 0.5}
  fit: {mode: evaluate_then_refit, seed: 11, tune: 600, draws: 600, chains: 4, engine: pymc, target_accept: 0.9}
evaluate: {metrics: [rmse, mape, coverage_90]}
outputs: {plots: [core.ppc_fan, core.convergence, core.posterior_forest]}
