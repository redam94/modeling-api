apiVersion: mapi/v1
kind: ModelSpec
metadata: {name: traction-force-synthetic, project: science, labels: {corpus: e60}}
data:
  dataset: dataset://science/tfm_synthetic@latest
model:
  use: sci.traction_force@^1
  settings:
    grid_um: 1.0
    young_pa: 8000
    poisson: 0.49
    prior: matern
    noise_um: 0.01
    traction_pa: 300
    lengthscale_um: 3.0
    field_draws: 100
    force_mask: true
  fit: {seed: 60, tune: 1000, draws: 1000, chains: 4, engine: pymc}
evaluate: {metrics: [rmse, mae, coverage_90]}
outputs: {plots: [core.convergence, core.posterior_forest, sci.vector_field]}
