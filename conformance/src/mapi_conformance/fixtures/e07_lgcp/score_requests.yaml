# E07: forecasts extend the random walk and the last era's map; contiguity and horizon errors.
- name: forecast_8
  request: {mode: forecast, horizon: {dim: period, periods: 8}, output: {draws: 20}}
  expect: {groups: [summary, draws], vars: [rate, total], sizes: {quarter: 8, row: 6, col: 5}}
- name: forecast_counts
  request: {mode: forecast, horizon: {dim: period, periods: 4}, output: {kind: predictive}}
  expect: {vars: [rate, total], sizes: {quarter: 4}}
- name: horizon_exceeds_fit
  request: {mode: forecast, horizon: {dim: period, periods: 9}}
  expect_error: HORIZON_EXCEEDS_FIT
- name: predict_last_year
  request: {mode: predict, output: {summary: [mean, q5, q95]}}
  payload: "tail:4"
  expect: {sizes: {quarter: 4, stat: 3}}
- name: gap_after_fit
  request: {mode: predict}
  payload: gapped
  expect_error: NON_CONTIGUOUS_EXTENSION
- name: counterfactual_unsupported
  request: {mode: counterfactual, interventions: [{var: quakes, multiply: 1.1}]}
  payload: "tail:2"
  expect_error: MODE_NOT_SUPPORTED
