# Plan section 6.2 with a plain scikit-learn estimator: histogram gradient boosting (native
# missing values, so a new store's empty lag context is fine) with split-conformal 80%
# intervals per cell. Same data, binding and pipeline as xgb_store_demand.
apiVersion: mapi/v1
kind: ModelSpec
metadata: {name: store-demand-sklearn, project: retail, labels: {corpus: sklearn_store_demand}}
data:
  dataset: dataset://retail/store_sku_weekly@latest
  bind:
    dims: {store: store_id, sku: sku, time: week}
    vars: {y: units_sold, price: price, promo: promo_flag}
  split: {kind: time_holdout, dim: time, last: 8}
pipeline:
  - id: imp
    use: core.impute@^1
    with: {vars: [price], method: ffill, along: time, within: [store, sku], unseen_levels: pooled}
  - id: plags
    use: core.lag@^1
    with: {vars: [promo], along: time, within: [store, sku], lags: [1, 2]}
  - {id: cal, use: core.calendar@^1, with: {along: time, features: [week_of_year, month]}}
  - {id: logy, use: core.log1p@^1, with: {vars: [y]}}
model:
  use: sklearn.tabular_conformal@^1
  settings:
    estimator:
      kind: sklearn.HistGradientBoostingRegressor
      params: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 31}
    rows: [store, sku, time]
    columns: {roles: [covariate]}
    coord_features: {store: category, sku: category}
    uncertainty: {kind: conformal, alpha: 0.2, calibration: 0.2}
    forecast_strategy: direct
    retransform: median
  fit: {seed: 7, mode: evaluate_then_refit}
evaluate: {metrics: [rmse, mape, coverage_80]}
# histogram boosting stores no feature importances, so ml.feature_importance is not listed
outputs: {plots: [core.fit_vs_actual, core.residuals_over_time]}
execution: {resource_class: S, timeout: 10m}
