# mmm-framework's frequentist MMM: the model owns scaling, carry-over and the inverse to
# original units, so the pipeline only converts currencies, resamples and adds holidays.
apiVersion: mapi/v1
kind: ModelSpec
metadata: {name: freq-geo, project: growth, labels: {family: mmm, fixture: mmm_frequentist}}

data:
  dataset: dataset://growth/eu_media_daily@latest
  side_tables:
    fx:       {ref: dataset://growth/fx_daily@latest, score_policy: supplied}
    holidays: {ref: dataset://shared/holidays_eu@v3, score_policy: pinned}
  bind:
    dims: {geo: market, channel: channel, time: date}
    vars: {y: revenue_local, spend: spend_local}
  split: {kind: time_holdout, dim: time, last: 4, after_step: weekly}

pipeline:
  - id: to_eur
    use: core.fx_convert@^1
    with: {vars: [y, spend], table: fx, table_along: date, currency_dim: geo, currencies: {UK: GBP}, default_currency: EUR}
  - {id: weekly, use: core.resample@^1, with: {dim: time, freq: W-SUN, how: sum, full_periods_only: true}}
  - {id: hols,   use: core.holidays@^1, with: {table: holidays, table_along: date, along: time}}

model:
  use: mmm.frequentist@^1
  settings:
    hierarchy: {pool_over: [geo]}
    new_levels: error
    adstock: {kind: geometric, l_max: 4}
    saturation: {kind: logistic}
    controls: [holiday]
    trend: {kind: none}
    seasonality: {yearly_order: 1}
    bootstrap: 60
    search_budget: 40
  fit: {mode: evaluate_then_refit, seed: 7}

outputs:
  plots: [core.ppc_fan]
evaluate: {metrics: [mape, coverage_90]}
execution: {resource_class: S, timeout: 15m}
