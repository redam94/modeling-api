# E33: hierarchical geo MMM - the plan's §6.1 spec on mmm-framework (mmm.bayesian), scaled
# down for the corpus. mmm-framework owns scaling and carry-over, so the pipeline only
# converts the GBP market to EUR, aggregates to weeks and adds the holiday control (no
# mean scaling, lag tensor or Fourier step). Differences from §6.1: adstock l_max 4, a tiny
# pymc fit (the nightly corpus overrides the draws) and new markets drawn from the fitted
# geo spread (new_levels: hyperprior) so the corpus can score one.
apiVersion: mapi/v1
kind: ModelSpec
metadata: {name: eu-geo-mmm, project: growth, labels: {family: mmm, fixture: e33}}

data:
  dataset: dataset://growth/eu_media_daily@latest
  side_tables:
    fx:       {ref: dataset://growth/fx_daily@latest, score_policy: supplied}
    holidays: {ref: dataset://shared/holidays_eu@v3, score_policy: pinned}
  bind:
    dims: {geo: market, channel: channel, time: date}
    vars: {y: revenue_local, spend: spend_local}
  split: {kind: time_holdout, dim: time, last: 8, after_step: weekly}

pipeline:
  - id: to_eur
    use: core.fx_convert@^1
    with: {vars: [y, spend], table: fx, table_along: date, currency_dim: geo, currencies: {UK: GBP}, default_currency: EUR}
  - {id: weekly, use: core.resample@^1, with: {dim: time, freq: W-SUN, how: sum, full_periods_only: true}}
  - {id: hols,   use: core.holidays@^1, with: {table: holidays, table_along: date, along: time}}

model:
  use: mmm.bayesian@^1
  settings:
    hierarchy: {pool_over: [geo]}
    new_levels: hyperprior
    adstock: {kind: geometric, l_max: 4}
    saturation: {kind: logistic}
    trend: {kind: none}
    seasonality: {yearly_order: 2}
  fit:
    mode: evaluate_then_refit
    engine: pymc
    tune: 150
    draws: 100
    chains: 2
    target_accept: 0.9
    seed: 20261014
    keep: {log_likelihood: true}

outputs:
  derived: [contributions, response_curves, marginal_cost]
  plots: [core.ppc_fan, core.convergence, mmm.decomposition, mmm.response_curves]
  ui_draws: 100
evaluate: {metrics: [elpd_loo, coverage_90, mape]}
execution: {resource_class: M, timeout: 45m}
