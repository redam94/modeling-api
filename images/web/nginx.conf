# nginx for mapi/web. Runs unprivileged (uid 101); every writable path is under /tmp so the
# container works with a read-only root filesystem and a tmpfs on /tmp. Server blocks are
# rendered at start-up from /etc/nginx/templates/<site>/ into /tmp/nginx/conf.d/.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time '
                  '"$http_user_agent" host=$host';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  charset utf-8;
  # Score payloads (XrJSON) are capped at ~5 MB by the API; uploads go straight to object
  # storage through signed URLs and never pass through here.
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain
             application/wasm;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  include /tmp/nginx/conf.d/*.conf;
}
