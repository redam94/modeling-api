[project]
name = "mapi-plugin-statsmodels"
version = "0.10.0"
description = "statsmodels time-series model plugins (SARIMAX, VAR, VECM, ECM, ETS, ...)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "xarray>=2025.1",
  # BSD-3-Clause. Fitted models are rebuilt from stored parameters, never pickled.
  "statsmodels>=0.15.0,<0.16",
]

[project.entry-points."mapi.models"]
statsmodels = "mapi_plugin_statsmodels:PLUGINS"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_plugin_statsmodels"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
