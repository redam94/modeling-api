[project]
name = "mapi-plugin-mmm"
version = "0.0.0"
description = "Marketing-mix model plugins (hierarchical geo MMM, pymc-marketing adapter)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
  "mapi-spec",
  "mapi-pymc",
  "mapi-steps",
  "pymc-marketing>=1.2,<1.3",
]

[project.entry-points."mapi.models"]
mmm = "mapi_plugin_mmm.plugins:PLUGINS"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_plugin_mmm"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
mapi-spec = { workspace = true }
mapi-pymc = { workspace = true }
mapi-steps = { workspace = true }
