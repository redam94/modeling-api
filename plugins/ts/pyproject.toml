[project]
name = "mapi-plugin-ts"
version = "0.15.0"
description = "Time-series / state-space model plugins (incl. Bayesian structural time series)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
  "mapi-pymc",
  "mapi-steps",
  "numpy>=2.0",
  "pandas>=2.2",
  "xarray>=2025.1",
  # Apache-2.0. ts.bsts builds its Kalman likelihood with pymc_extras.statespace; the
  # statespace API changes between minors, so the pin stays inside one minor.
  "pymc-extras>=0.12.1,<0.13",
]

[project.entry-points."mapi.models"]
ts = "mapi_plugin_ts:PLUGINS"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_plugin_ts"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
mapi-pymc = { workspace = true }
mapi-steps = { workspace = true }
