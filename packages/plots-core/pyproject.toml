[project]
name = "mapi-plots"
version = "0.12.0"
description = "Plot recipes and the JSON-only PlotSpec sanitizer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
# Core install = sanitizer + templates only: JSON in, JSON out, safe for the control plane.
dependencies = [
  "mapi-spec",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
# Recipe catalog, domain packs and the altair/plotly conversion helpers (runner images, notebooks).
recipes = [
  "altair>=5.4",
  "plotly>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "xarray>=2025.1",
]
# Static rendering in the sandbox (``render`` runs): Vega-Lite -> PNG/SVG/PDF. Pinned exactly:
# the renderer is part of the image's attack surface (it embeds Deno/V8). Plotly static
# export needs kaleido plus a system Chrome/Chromium and is not part of the extra.
render = ["vl-convert-python==1.9.0.post1"]

[project.entry-points."mapi.plots"]
core = "mapi_plots.recipes:standard_recipes"
mmm = "mapi_plots.packs.mmm:mmm_recipes"
ml = "mapi_plots.packs.ml:ml_recipes"
sci = "mapi_plots.packs.sci:sci_recipes"
net = "mapi_plots.packs.net:net_recipes"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_plots"]

[tool.uv.sources]
mapi-spec = { workspace = true }
