[project]
name = "mapi-gcs-shim"
version = "0.0.0"
description = "Local Google Cloud Storage emulator for modeling-api dev and tests"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "google-crc32c>=1.5",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.scripts]
mapi-gcs-shim = "mapi_gcs_shim.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_gcs_shim"]
