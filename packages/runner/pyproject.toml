[project]
name = "mapi-runner"
version = "0.1.0"
description = "Sandboxed run harness (supervisor + worker) for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
# The supervisor needs only mapi-spec + httpx; the worker side needs the SDK, recipes and the
# array stack. Plugins (mapi-pymc, mapi-sklearn, mapi-plugin-*) come from the base image.
# Optional static rendering (``render`` runs): vl-convert-python and kaleido in the image.
dependencies = [
  "mapi-spec",
  "mapi-sdk",
  "mapi-plots[recipes]",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "xarray>=2025.1",
]

[project.scripts]
mapi-runner = "mapi_runner.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_runner"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-sdk = { workspace = true }
mapi-plots = { workspace = true }
