[project]
name = "mapi-runner"
version = "0.0.0"
description = "Sandboxed run harness (supervisor + worker) for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
  "mapi-plots[recipes]",
  "httpx>=0.27",
]

[project.scripts]
mapi-runner = "mapi_runner.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_runner"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
mapi-plots = { workspace = true }
