[project]
name = "mapi-runner"
version = "0.15.0"
description = "Sandboxed run harness (supervisor + worker) for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
# The supervisor needs only mapi-spec + httpx; the worker side needs the SDK, recipes and the
# array stack. Plugins (mapi-pymc, mapi-sklearn, mapi-plugin-*) come from the base image.
# Static rendering (``render`` runs): vl-convert-python via mapi-plots[render]; Plotly needs
# kaleido and a system Chrome, which the images do not ship (render runs refuse Plotly).
dependencies = [
  "mapi-spec",
  "mapi-sdk",
  "mapi-plots[recipes,render]",
  "mapi-workflows[runtime]",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "xarray>=2025.1",
  # M3.5: governance checks and explorer views (stat tests, STL, VIF) in the sandbox.
  "scipy>=1.13",
  "statsmodels>=0.14.4",
  # M4: NetCDF-4 groups and raw HDF5 uploads (read only after worker.hdf5_guard checks them).
  "h5py>=3.11",
  "h5netcdf>=1.4",
  # v0.14: image_folder ingest decodes PNG/JPEG/TIFF in the sandboxed worker (HPND/MIT-CMU licence).
  "pillow>=11.0",
]

[dependency-groups]
# Test-only: the local GCS emulator (pytest fixtures) and the conformance fixtures the
# end-to-end tests ingest, fit and score. Never runtime dependencies of the runner image.
test = ["mapi-gcs-shim", "mapi-conformance"]

[project.scripts]
mapi-runner = "mapi_runner.__main__:main"

# Every governance check as a check runner of workflow governance nodes (M3.5).
[project.entry-points."mapi.governance_checks"]
runner = "mapi_runner.worker.governance_checks:check_runners"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_runner"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-gcs-shim = { workspace = true }
mapi-conformance = { workspace = true }
mapi-sdk = { workspace = true }
mapi-plots = { workspace = true }
mapi-workflows = { workspace = true }
