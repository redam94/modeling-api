[project]
name = "mapi-spec"
version = "0.7.0"
description = "Pure-Pydantic contracts for modeling-api (specs, schemas, manifests, plot envelopes)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
mapi-spec = "mapi_spec.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_spec"]
