[project]
name = "mapi-client"
version = "0.1.0"
description = "Python client for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-spec",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_client"]

[tool.uv.sources]
mapi-spec = { workspace = true }
