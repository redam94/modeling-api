[project]
name = "mapi-steps"
version = "0.0.0"
description = "Built-in preprocessing steps for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_steps"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
