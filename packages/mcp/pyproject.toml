[project]
name = "mapi-mcp"
version = "0.16.0"
description = "MCP stdio bridge to the modeling-api dashboard tools (read-only)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
# Exactly these two (both already locked by the workspace): the bridge adds no new package.
dependencies = [
  "mapi-spec",
  "httpx>=0.27",
]

[project.scripts]
mapi-mcp = "mapi_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_mcp"]

[tool.uv.sources]
mapi-spec = { workspace = true }
