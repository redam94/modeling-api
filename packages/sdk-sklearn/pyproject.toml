[project]
name = "mapi-sklearn"
version = "0.15.0"
description = "scikit-learn / xgboost model base classes for modeling-api"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-sdk",
  "numpy>=2.0",
  "scipy>=1.13",
  "xarray>=2025.1",
  "scikit-learn>=1.6",
  "skops>=0.11",
  "xgboost>=3.0",
]

[project.optional-dependencies]
# LightGBM and CatBoost estimators (v0.14), imported lazily. The base-ml image installs the extra.
gbm = ["lightgbm>=4.5,<5", "catboost>=1.2.7,<2"]

[project.entry-points."mapi.models"]
sklearn = "mapi_sklearn.plugins:PLUGINS"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_sklearn"]

[tool.uv.sources]
mapi-sdk = { workspace = true }
