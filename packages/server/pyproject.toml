[project]
name = "mapi-server"
version = "0.6.0"
description = "modeling-api control plane (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-spec",
  "mapi-plots",
  "mapi-gcs-shim",
  "mapi-workflows",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "procrastinate>=3.0",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "psycopg-pool>=3.2",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-run>=0.10",
  "google-cloud-storage>=2.18",
  "google-cloud-pubsub>=2.23",
  "google-cloud-kms>=3.0",
]
docker = ["docker>=7.1"]
# OTLP/HTTP span export (enabled by OTEL_EXPORTER_OTLP_ENDPOINT / MAPI_OTLP_ENDPOINT)
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
mapi-server = "mapi_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_server"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-plots = { workspace = true }
mapi-gcs-shim = { workspace = true }
mapi-workflows = { workspace = true }
