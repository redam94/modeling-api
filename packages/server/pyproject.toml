[project]
name = "mapi-server"
version = "0.1.0"
description = "modeling-api control plane (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-spec",
  "mapi-plots",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "procrastinate>=3.0",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "psycopg-pool>=3.2",
  "structlog>=24.1",
]

[project.optional-dependencies]
gcp = ["google-cloud-run>=0.10", "google-cloud-storage>=2.18", "google-cloud-pubsub>=2.23"]
docker = ["docker>=7.1"]

[project.scripts]
mapi-server = "mapi_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_server"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-plots = { workspace = true }
