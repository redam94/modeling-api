[project]
name = "mapi-cli"
version = "0.15.1"
description = "The `mapi` command line"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = [
  "mapi-spec",
  "mapi-sdk",
  "mapi-client[xarray]",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
# `mapi new --with-data` writes the conformance fixtures' tiny sample datasets
samples = ["mapi-conformance"]

[project.scripts]
mapi = "mapi_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_cli"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-sdk = { workspace = true }
mapi-client = { workspace = true }
mapi-conformance = { workspace = true }
