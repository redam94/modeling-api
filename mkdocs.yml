site_name: modeling-api
site_description: Fit, score and share labelled multi-dimensional models — safely.
site_author: Matthew Reda
copyright: Documentation CC BY 4.0 · SDK Apache-2.0 · Platform AGPLv3 or commercial
docs_dir: docs
exclude_docs: |
  architecture-plan.md
  snippets/
  reference/generated/fragments/
  assets/brand/PROVENANCE.md
  assets/brand/icons/PROVENANCE.md
# v0.19: the old "Coming in 0.19" page stays as a short pointer for old links
not_in_nav: |
  extend/upload-roadmap.md

theme:
  name: material
  # the Mono look: templates in overrides/, styles in docs/stylesheets/, scripts in docs/javascripts/
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  # no Google Fonts: Inter and JetBrains Mono are self-hosted in docs/assets/fonts/
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

extra_css:
  - stylesheets/mono.css
  - stylesheets/mono-chrome.css
  - stylesheets/mono-content.css
  - stylesheets/mono-blocks.css

# Material loads `mermaid@11` (a moving tag) from unpkg unless mermaid is already present.
# The pinned bundle is vendored instead (scripts/vendor_mermaid.py), so no page asks another host.
# overrides/main.html loads it, and only on a page that has a diagram (the file is 3.5 MB).
extra_javascript:
  - javascripts/mono.js

extra:
  # The "Try" list in the search dialog when the box is empty. `url` is a site path.
  search_popular:
    - title: Your first Guided analysis
      url: guides/guided-tutorial/
      hint: Tutorial
    - title: Install modeling-api
      url: getting-started/
      hint: Learn
    - title: Build a client dashboard
      url: guides/client-dashboards/
      hint: Guide
    - title: Share a dashboard with a link
      url: guides/sharing-dashboards-securely/
      hint: Guide
    - title: Choose a model
      url: guides/choosing-a-model/
      hint: Guide
    - title: Upload your own code
      url: extend/upload/
      hint: Extend
    - title: Error codes
      url: reference/generated/error-codes/
      hint: Reference
    - title: Troubleshooting
      url: operations/troubleshooting/
      hint: Operate

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  # The separator also splits names: `share_link` and `core.calendar` give two words each, so
  # a reader finds them with "share link" or "calendar". A dot before a digit stays (v0.20).
  # CamelCase names stay whole: a split made a query for `ModelSpec` match "model" on every
  # page. The boost of each page is set in scripts/mkdocs_hooks.py.
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|_|&[lg]t;'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/spec/src
            - packages/sdk/src
            - packages/sdk-pymc/src
            - packages/sdk-sklearn/src
            - packages/steps-core/src
            - packages/plots-core/src
            - packages/runner/src
            - packages/client/src
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            show_if_no_docstring: false
            show_labels: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/snippets, "."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

