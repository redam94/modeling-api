# Optional local tweaks to docker-compose.yml. Copy to compose.override.yml (git-ignored by
# convention; never commit secrets in it) and keep only the blocks you want. `docker compose`
# merges compose.override.yml automatically.
#
#   cp compose.override.example.yml compose.override.yml
#   docker compose config        # inspect the merged result

services:
  # --- 1. Reach Postgres from the host (psql, a GUI client) --------------------------------
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # --- 2. Docker executor instead of local-process -----------------------------------------
  # Runs each fit/score in its own container from the exact runner images (mapi/base-*, built
  # by `make docker-build`), instead of as a subprocess of the worker. The image is chosen per
  # model plugin. Trade-offs (docs/operations/docker.md):
  #   + one container per run (separate filesystem, resource limits, worker uid split)
  #   + exactly the production images
  #   - the worker gets the Docker socket, which is root-equivalent on the host
  #   - run containers join the gcs-shim network namespace (the bootstrap object and signed
  #     URLs live at 127.0.0.1:4443), so they can also reach the API on 127.0.0.1:8000
  # The worker keeps the mapi/worker image (it has the docker SDK and computes the catalog
  # digest the same way as the local-process setup).
  gcs-shim:
    container_name: mapi-gcs-shim  # a fixed name for MAPI_DOCKER_NETWORK below

  worker:
    user: "10001:${DOCKER_GID:-0}"   # the group that owns /var/run/docker.sock on the host
    environment:
      MAPI_EXECUTOR: docker
      MAPI_DOCKER_NETWORK: container:mapi-gcs-shim
      MAPI_DOCKER_IMAGE: mapi/base-bayes:${MAPI_VERSION:-0.15.0}
      MAPI_DOCKER_IMAGES: >-
        {"mmm": "mapi/base-bayes:${MAPI_VERSION:-0.15.0}",
        "tabular": "mapi/base-bayes:${MAPI_VERSION:-0.15.0}",
        "sklearn": "mapi/base-ml:${MAPI_VERSION:-0.15.0}",
        "ts": "mapi/base-forecast:${MAPI_VERSION:-0.15.0}",
        "causal": "mapi/base-forecast:${MAPI_VERSION:-0.15.0}",
        "dl": "mapi/base-dl:${MAPI_VERSION:-0.15.0}"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # --- 3. Bigger runs ---------------------------------------------------------------------
  # Raise MAPI_WORKER_TMPFS / MAPI_WORKER_MEMORY / MAPI_WORKER_CPUS in .env instead of
  # editing here; the worker's /tmp is the scratch space of every local-process run.
