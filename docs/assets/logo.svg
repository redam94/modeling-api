<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" role="img" aria-label="modeling-api">
  <title>modeling-api</title>
  <!-- Three stacked bars: a labelled series, each level shorter than the one above it.
       The middle bar is the text colour. As a file (an <img>) it follows the system colour
       scheme; the site header draws the same mark inline (overrides/partials/logo.html). -->
  <style>
    svg { color: #1d1d1f; }
    .top { fill: #0072b2; }
    .low { fill: #d55e00; }
    @media (prefers-color-scheme: dark) {
      svg { color: #f5f5f7; }
      .top { fill: #56b4e9; }
      .low { fill: #ff9a52; }
    }
  </style>
  <rect class="top" x="2" y="4" width="20" height="4" rx="2"/>
  <rect x="5" y="10" width="14" height="4" rx="2" fill="currentColor"/>
  <rect class="low" x="9" y="16" width="6" height="4" rx="2"/>
</svg>
