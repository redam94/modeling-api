# Root of the modeling-api uv workspace. This root project is virtual (not built/published);
# it exists to install every workspace member plus shared developer tooling with `uv sync`.
[project]
name = "modeling-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "mapi-spec", "mapi-sdk", "mapi-pymc", "mapi-sklearn", "mapi-steps", "mapi-plots[recipes]",
  "mapi-runner", "mapi-server[docker,otlp]", "mapi-gcs-shim", "mapi-cli", "mapi-client",
  "mapi-plugin-mmm", "mapi-plugin-ts", "mapi-plugin-tabular", "mapi-conformance",
]

[dependency-groups]
dev = [
  "pytest>=8.3", "pytest-cov>=5.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6", "pytest-timeout>=2.3",
  "hypothesis>=6.112", "ruff>=0.7", "mypy>=1.13", "import-linter>=2.1", "pre-commit>=4.0",
  "pgserver>=0.1.4", "respx>=0.21", "types-pyyaml",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-macros-plugin>=1.3"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "plugins/*", "conformance"]

[tool.uv.sources]
mapi-spec = { workspace = true }
mapi-sdk = { workspace = true }
mapi-pymc = { workspace = true }
mapi-sklearn = { workspace = true }
mapi-steps = { workspace = true }
mapi-plots = { workspace = true }
mapi-runner = { workspace = true }
mapi-server = { workspace = true }
mapi-gcs-shim = { workspace = true }
mapi-cli = { workspace = true }
mapi-client = { workspace = true }
mapi-plugin-mmm = { workspace = true }
mapi-plugin-ts = { workspace = true }
mapi-plugin-tabular = { workspace = true }
mapi-conformance = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "node_modules", "docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not docker and not cloud and not e2e'"
testpaths = ["packages", "plugins", "conformance", "tests"]
markers = [
  "unit: fast isolated tests",
  "integration: touches Postgres, the GCS shim, or subprocesses",
  "slow: takes more than ~10s (e.g. MCMC)",
  "docker: needs a running Docker daemon (auto-skipped otherwise)",
  "cloud: needs real cloud credentials (never run in CI by default)",
  "conformance: conformance corpus runs",
  "sandbox: sandbox / security probes",
  "e2e: end-to-end through the running stack",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["mapi_server", "mapi_spec", "mapi_plots", "mapi_runner"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Control plane never imports plugin/runtime code or array libraries"
type = "forbidden"
source_modules = ["mapi_server"]
forbidden_modules = [
  "mapi_sdk", "mapi_runner", "mapi_pymc", "mapi_sklearn", "mapi_steps",
  "mapi_plugin_mmm", "mapi_plugin_ts", "mapi_plugin_tabular",
  "mapi_plots.recipes", "mapi_plots.packs",
  "numpy", "xarray", "pandas", "pyarrow", "zarr",
]

[[tool.importlinter.contracts]]
name = "Contracts are pure Pydantic"
type = "forbidden"
source_modules = ["mapi_spec"]
forbidden_modules = ["numpy", "xarray", "pandas"]

[[tool.importlinter.contracts]]
name = "Plot sanitizer and templates are JSON-only (control-plane safe)"
type = "forbidden"
source_modules = ["mapi_plots.sanitize", "mapi_plots.templates", "mapi_plots._testing"]
forbidden_modules = ["numpy", "xarray", "pandas", "altair", "plotly", "pyarrow", "mapi_sdk"]

[[tool.importlinter.contracts]]
name = "Runner supervisor never imports plugin code, the SDK or array libraries"
type = "forbidden"
source_modules = [
  "mapi_runner.supervisor", "mapi_runner.__main__", "mapi_runner.bootstrap",
  "mapi_runner.channel", "mapi_runner.events", "mapi_runner.jobs", "mapi_runner.outputs",
  "mapi_runner.sandbox", "mapi_runner.transfer", "mapi_runner._text", "mapi_runner.obslog",
]
forbidden_modules = [
  "mapi_runner.worker", "mapi_runner.testing", "mapi_sdk", "mapi_pymc", "mapi_sklearn",
  "mapi_steps", "mapi_plots", "mapi_plugin_mmm", "mapi_plugin_ts", "mapi_plugin_tabular",
  "numpy", "xarray", "pandas",
]
