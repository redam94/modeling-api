# The MALICIOUS test plugin. NOT a workspace member and NOT wired to the `mapi.models` entry
# point — it is loaded only by the security suite, never by a normal install. Do not publish.
[project]
name = "mapi-security-plugin"
version = "0.0.0"
description = "DELIBERATELY MALICIOUS model/step plugin for the security suite — do NOT install"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
dependencies = ["mapi-sdk", "mapi-spec", "mapi-security"]

# Intentionally NO [project.entry-points."mapi.models"]: the platform must never discover it.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_security_plugin"]
