# The malicious upload corpus (v0.19, WP12). Every case names one hostile upload, the threat it
# exercises (T19.x, V0.19-PLAN §6 grouping), the stage that must refuse or neutralize it and the
# stable result: an InspectCheck (stage "inspect"), a check_describe rule (stage "describe"), an
# ErrorCode (stages "upload", "review"), "neutralized" (stage "render": stored and shown as plain
# text, never as markup or a formula) or a run outcome (stage "runtime").
#
# `build_corpus.py` builds each case into a temporary directory. Nothing here is ever installed,
# extracted or imported outside a sandbox run; `tests/security/conftest.py` enforces that.
#
# Placeholders in `path`: {ns} = the namespace, {dist_info} = "<ns>-<version>.dist-info",
# {data} = "<ns>-<version>.data".
#
# Fields: name, group, threat, stage, expect, artifact ("wheel" | "describe" | "ticket" |
# "scenario"), summary; optional: path (the problem path), says (a phrase of the message),
# live (true: part of the live check's "upload through the UI and CLI" set).

[corpus]
namespace = "t_crpsxx_evil"
probe_namespace = "t_crpsxx_probe"
version = "0.1.0"
plugin_version_id = "plv_01jbz3q2x8m9v7k5h4g3f2e1d1"
builtin_titles = ["Bayesian MMM", "Weekly totals", "Cap extreme values", "Fit vs actual"]

# The synthetic base image the CI gate resolves requirements and shadowing against (the real
# image is used by the sandbox run). Kept small and fixed so the expected results are stable.
[base_image]
requires_python = "3.12.15"
image_digest = "sha256:abababababababababababababababababababababababababababababababab"
top_level = ["mapi_sdk", "mapi_spec", "mapi_plots", "mapi_workflows", "numpy", "pandas",
             "xarray", "altair", "typing_extensions"]

[base_image.dists]
mapi-sdk = "0.16.0"
mapi-spec = "0.16.0"
mapi-plots = "0.16.0"
mapi-workflows = "0.16.0"
mapi-plugin-mmm = "0.16.0"
numpy = "2.1.3"
pandas = "2.2.3"
xarray = "2024.11.0"
altair = "5.4.1"
typing-extensions = "4.12.2"

[base_image.requires]
mapi-plots = ["pydantic>=2", "altair>=5; extra == 'recipes'", "plotly>=5; extra == 'recipes'"]

