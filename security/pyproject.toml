# The security probe suite. Deliberately NOT a uv workspace member (the root workspace globs
# are packages/*, plugins/*, conformance), so `uv sync --all-packages` never installs it. Run
# it with `make security-suite`, which puts security/src (+ the malicious plugin) on PYTHONPATH
# against the already-installed workspace venv.
[project]
name = "mapi-security"
version = "0.2.0"
description = "modeling-api security probe suite (sandbox escape corpus + runner)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only OR LicenseRef-mapi-commercial"
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
# Runtime deps for the probes and the platform checks. The suite imports these from the
# workspace venv; this list documents the contract rather than driving a separate install.
dependencies = ["mapi-spec", "mapi-plots"]

[project.scripts]
mapi-security = "mapi_security.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_security"]
